name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q main.py ui.py outlook_flow scripts
      - name: Install Windows runtime dependencies
        run: python -m pip install -r requirements.txt --target lib
      - name: Verify dependency imports
        run: python -c "import sys; sys.path.insert(0, 'lib'); import msal, msal_extensions, keyring, requests, openai, tkinter"
      - name: Build installable package
        run: python scripts/package.py --release
      - uses: actions/upload-artifact@v4
        with:
          name: OutlookWorkspace-Windows
          path: dist/Flow.Launcher.Plugin.OutlookWorkspace.zip
          if-no-files-found: error
